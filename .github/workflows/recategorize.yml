name: recategorize semanal

on:
  schedule:
    # domingo 6h em Brasilia (UTC-3) = 9h UTC
    - cron: "0 9 * * 0"
  workflow_dispatch:

jobs:
  recategorize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cria .env a partir dos secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: echo "DATABASE_URL=$DATABASE_URL" > .env

      - name: Reclassifica categorias
        run: npm run recategorize -- --apply

      - name: Retencao de dados (disco Supabase)
        run: npm run retention
